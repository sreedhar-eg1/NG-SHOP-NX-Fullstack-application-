<div
  class="flex align-items-center justify-content-center min-h-screen surface-ground p-4"
>
  <div
    class="surface-card p-5 shadow-2 border-round w-full"
    style="max-width: 420px"
  >
    <div class="text-center mb-5">
      <div class="text-900 text-3xl font-medium mb-2">Welcome Back</div>
      <span class="text-600 font-medium">Sign in to continue</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="block text-900 font-medium mb-2">Email</label>
        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          class="w-full"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="block text-900 font-medium mb-2">
          Password
        </label>
        <p-password
          inputId="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          fluid
        />
      </div>

      @if (error(); as errorMsg) {
      <p-message severity="error" class="w-full mb-3">
        {{ errorMsg }}
      </p-message>
      }

      <p-button
        type="submit"
        label="Sign In"
        icon="pi pi-user"
        fluid
        [loading]="loading()"
        [disabled]="loginForm.invalid"
      />
    </form>
  </div>
</div>
